name: AI Trading Market Intelligence
on:
  schedule:
    - cron: "50 15 * * *"
    - cron: "10 3 * * 1-5"
    - cron: "40 4 * * 1-5"
    - cron: "40 5 * * 1-5"
    - cron: "40 6 * * 1-5"
    - cron: "40 7 * * 1-5"
    - cron: "40 8 * * 1-5"
    - cron: "40 9 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: Report phase
        required: true
        default: pre_market
        type: choice
        options: [night, pre_market, live_scan, final_session]
permissions:
  contents: write
jobs:
  market-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Determine phase
        id: phase
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "phase=${{ github.event.inputs.phase }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "${{ github.event.schedule }}" in
            "50 15 * * *") echo "phase=night" >> "$GITHUB_OUTPUT" ;;
            "10 3 * * 1-5") echo "phase=pre_market" >> "$GITHUB_OUTPUT" ;;
            "40 4 * * 1-5"|"40 5 * * 1-5"|"40 6 * * 1-5"|"40 7 * * 1-5"|"40 8 * * 1-5") echo "phase=live_scan" >> "$GITHUB_OUTPUT" ;;
            "40 9 * * 1-5") echo "phase=final_session" >> "$GITHUB_OUTPUT" ;;
            *) echo "phase=live_scan" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Validate modules
        run: |
          python -m compileall -q src
          python -c "from src.market_intelligence import run; from src.news_intelligence import collect_fresh_news; print('Modules OK')"
      - name: Validate secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is not configured"; exit 1; }
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "TELEGRAM_BOT_TOKEN is not configured"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "TELEGRAM_CHAT_ID is not configured"; exit 1; }
      - name: Run market intelligence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
        run: python -m src.market_intelligence --phase "${{ steps.phase.outputs.phase }}"
      - name: Upload intelligence state
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-state-${{ steps.phase.outputs.phase }}
          path: data/*.json
          if-no-files-found: warn
          retention-days: 14
